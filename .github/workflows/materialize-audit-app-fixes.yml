name: Materialize audited app fixes

on:
  push:
    branches:
      - fix/valuation-foundation-audit-2026-09-17

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply exact app.js fixes
        run: python3 scripts/materialize_audit_app_fixes.py

      - name: Remove one-shot materializer
        run: |
          rm scripts/materialize_audit_app_fixes.py
          rm .github/workflows/materialize-audit-app-fixes.yml

      - name: Commit materialized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: align calculator and caches with market values"
          git push origin HEAD:${GITHUB_REF_NAME}
