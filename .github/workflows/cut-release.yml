name: Cut release from prod

on:
  push:
    branches: [prod]

concurrency:
  group: cut-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cut-release:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prod
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/cut_github_release.sh
