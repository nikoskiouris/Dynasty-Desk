name: Materialize Python pick-order fix

on:
  push:
    branches:
      - fix/valuation-foundation-audit-2026-09-17

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - run: python3 scripts/materialize_python_pick_fix.py
      - run: |
          rm scripts/materialize_python_pick_fix.py
          rm .github/workflows/materialize-python-pick-fix.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: normalize fitted pick buckets in dependency order"
          git push origin HEAD:${GITHUB_REF_NAME}
